instances:
  - url: pensar.docs.buildwithfern.com/apex
    custom-domain: docs.pensar.dev/apex

experimental:
  basepath-aware: true

title: Pensar Apex

metadata:
  og:site_name: "Pensar Apex Documentation"
  og:title: "Pensar Apex | Documentation"
  og:description: "AI-powered penetration testing CLI."
  og:url: "https://docs.pensar.dev/apex"
  og:image: "https://pensar-brand-assets.s3.us-east-1.amazonaws.com/docs-og-image.png"
  og:image:width: 1200
  og:image:height: 630
  og:locale: "en_US"
  # Dynamic per-page cards (Fern renders logo + section + title + description
  # over the background). Static og:image above applies to the homepage only.
  og:dynamic: true
  og:dynamic:background-image: ./docs/assets/og-background-livecells.png
  og:dynamic:background-color: "#000000"
  og:dynamic:text-color: "#e5e5e5"
  og:dynamic:logo-color: dark
  og:dynamic:show-logo: true
  og:dynamic:show-section: true
  og:dynamic:show-description: true
  # Off: on basepath instances Fern renders the URL as .../apex/apex/<page>.
  og:dynamic:show-url: false
  og:dynamic:show-gradient: false
  twitter:title: "Pensar Apex Documentation"
  twitter:description: "AI-powered penetration testing CLI."
  twitter:handle: "@ai_pensar"
  twitter:image: "https://pensar-brand-assets.s3.us-east-1.amazonaws.com/docs-og-image.png"
  twitter:site: "@ai_pensar"
  twitter:card: "summary_large_image"

layout:
  searchbar-placement: header
  page-width: full

tabs:
  blog:
    display-name: Blog
    icon: fa-regular fa-newspaper
    href: https://pensarai.com/blog
  apex:
    display-name: Apex
    icon: fa-regular fa-laptop
    slug: ""
  console:
    display-name: Console
    icon: fa-regular fa-book
    href: https://docs.pensar.dev/console

navigation:
  - tab: blog
    layout:
  - tab: apex
    layout:
      - section: Overview
        contents:
          - page: Introduction
            path: ./docs/intro.mdx
          - page: Getting Started
            path: ./docs/getting-started.mdx
      - section: TUI Slash Commands
        contents:
          - page: /pentest
            path: ./docs/commands/pentest.mdx
          - page: /operator
            path: ./docs/commands/operator.mdx
          - page: /threat-model
            path: ./docs/commands/threat-model.mdx
          - page: /login
            path: ./docs/commands/auth.mdx
          - page: /models
            path: ./docs/commands/models.mdx
          - page: /providers
            path: ./docs/commands/providers.mdx
          - page: /sessions
            path: ./docs/commands/sessions.mdx
          - page: /themes
            path: ./docs/commands/themes.mdx
          - page: /credits
            path: ./docs/commands/credits.mdx
          - page: /config
            path: ./docs/commands/config.mdx
          - page: /create-skill
            path: ./docs/commands/create-skill.mdx
          - page: /help
            path: ./docs/commands/help.mdx
      - section: CLI Commands
        contents:
          - page: pensar pentest
            path: ./docs/cli/pentest.mdx
          - page: pensar targeted-pentest
            path: ./docs/cli/targeted-pentest.mdx
          - page: pensar threat-model
            path: ./docs/cli/threat-model.mdx
          - page: pensar login
            path: ./docs/cli/auth.mdx
          - page: pensar pentests
            path: ./docs/cli/pentests.mdx
          - page: pensar targets
            path: ./docs/cli/targets.mdx
          - page: pensar issues
            path: ./docs/cli/issues.mdx
          - page: pensar apps
            path: ./docs/cli/apps.mdx
          - page: pensar fixes
            path: ./docs/cli/fixes.mdx
          - page: pensar knowledge
            path: ./docs/cli/knowledge.mdx
          - page: pensar logs
            path: ./docs/cli/logs.mdx
          - page: pensar config
            path: ./docs/cli/config.mdx
          - page: pensar upgrade
            path: ./docs/cli/upgrade.mdx
          - page: pensar doctor
            path: ./docs/cli/doctor.mdx
          - page: pensar uninstall
            path: ./docs/cli/uninstall.mdx
          - page: pensar version
            path: ./docs/cli/version.mdx
      - section: SDK
        slug: sdk
        contents:
          - page: Overview
