# Integration CI – Console Typecheck
# ==================================
# Clones pensarai/console (which submodules apex), updates the apex
# submodule to the current PR / push branch, then runs the console
# typecheck to ensure apex changes don't break downstream consumers.

name: Integration CI

on:
  pull_request:
  push:
    branches: [main, canary]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  console-typecheck:
    # Fork PRs don't receive secrets, so the private console checkout can't run there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout apex (this repo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: apex

      - name: Checkout pensarai/console
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: pensarai/console
          token: ${{ secrets.CONSOLE_REPO_TOKEN }}
          submodules: recursive
          path: console

      - name: Update apex submodule to current ref
        working-directory: console
        run: |
          # Find the apex submodule path inside console
          SUBMODULE_PATH=$(git config --file .gitmodules --get-regexp 'submodule\..*\.url' \
            | grep 'apex' | head -n1 \
            | sed 's/submodule\.\(.*\)\.url.*/\1/')

          if [ -z "$SUBMODULE_PATH" ]; then
            echo "::error::Could not find an apex submodule in console/.gitmodules"
            exit 1
          fi

          echo "Found apex submodule at: $SUBMODULE_PATH"

          # Point the submodule at the local apex checkout and update
          cd "$SUBMODULE_PATH"
          git fetch "$GITHUB_WORKSPACE/apex" "$GITHUB_SHA"
          git checkout "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install console dependencies
        # Not --frozen-lockfile: in-flight apex dep changes won't be in downstream lockfiles yet.
        working-directory: console
        run: bun install

      - name: Install SST providers
        working-directory: console
        run: |
          bun sst version
          bun sst install

      - name: Typecheck console
        working-directory: console
        run: bun run tsc
