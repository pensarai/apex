# CI Pipeline
# ===========
# Runs lint/format, typecheck, and build in parallel on every PR and push to main.
# Each job is a reusable workflow and shows as a separate check in the
# GitHub PR UI.

name: CI

on:
  pull_request:
  push:
    branches: [main, canary]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-pins:
    name: Action pins
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check every action and container image is pinned
        run: python3 .github/tests/action-pins.py

  lint:
    uses: ./.github/workflows/lint.yml

  dead-code:
    uses: ./.github/workflows/knip.yml

  typecheck:
    uses: ./.github/workflows/typecheck.yml

  test:
    uses: ./.github/workflows/test.yml

  build:
    uses: ./.github/workflows/build.yml

  windows-http:
    name: Windows tool contracts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Exercise Windows HTTP and coding tools
        run: bun run test src/core/agents/offSecAgent/tools/windowsCurl.test.ts src/core/agents/offSecAgent/tools/fileWorkspace.test.ts src/core/agents/offSecAgent/tools/codingTools.windows.test.ts src/core/agents/offSecAgent/tools/perCommandShell.windows.test.ts
      - name: Exercise native and injected script transports
        run: bun run test src/core/tools/backends/resolve.test.ts -t "script transport resolution"
      - name: Exercise native Windows background jobs
        run: bun run test src/core/whitebox/jobKernel.test.ts src/core/whitebox/whitebox.test.ts -t "whitebox jobs|synchronous Windows"
      - name: Exercise injected Windows background jobs
        run: bun run test src/core/tools/backends/whiteboxJobs.test.ts
      - name: Exercise sandbox finding collection
        run: bun run test src/core/agents/specialized/pentest/results.test.ts
