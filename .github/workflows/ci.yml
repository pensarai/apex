# CI Pipeline
# ===========
# Runs lint/format, typecheck, and build in parallel on every PR and push to main.
# Each job is a reusable workflow and shows as a separate check in the
# GitHub PR UI.

name: CI

on:
  pull_request:
  push:
    branches: [main, canary]

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  dead-code:
    uses: ./.github/workflows/knip.yml

  slop-scan:
    # Granted here on the caller; the reusable workflow inherits these. A
    # called workflow cannot request more than the caller holds, so the
    # neutral check + comment need write scopes set at this level.
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/slop-scan.yml

  typecheck:
    uses: ./.github/workflows/typecheck.yml

  test:
    uses: ./.github/workflows/test.yml

  build:
    uses: ./.github/workflows/build.yml
