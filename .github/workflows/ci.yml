# CI Pipeline
# ===========
# Runs lint/format, typecheck, and build in parallel on every PR and push to main.
# Each job is a reusable workflow and shows as a separate check in the
# GitHub PR UI.

name: CI

on:
  pull_request:
  push:
    branches: [main, canary]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Audit workflows and local actions
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          # Pedantic reports an image pinned to a tag instead of a digest.
          persona: pedantic
          advanced-security: false
          annotations: true

  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  dead-code:
    uses: ./.github/workflows/knip.yml
    permissions:
      contents: read

  typecheck:
    uses: ./.github/workflows/typecheck.yml
    permissions:
      contents: read

  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  windows-http:
    name: Windows tool contracts
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Exercise Windows HTTP and coding tools
        run: bun run test src/core/agents/offSecAgent/tools/windowsCurl.test.ts src/core/agents/offSecAgent/tools/fileWorkspace.test.ts src/core/agents/offSecAgent/tools/codingTools.windows.test.ts src/core/agents/offSecAgent/tools/perCommandShell.windows.test.ts
      - name: Exercise native and injected script transports
        run: bun run test src/core/tools/backends/resolve.test.ts -t "script transport resolution"
      - name: Exercise native Windows background jobs
        run: bun run test src/core/whitebox/jobKernel.test.ts src/core/whitebox/whitebox.test.ts -t "whitebox jobs|synchronous Windows"
      - name: Exercise injected Windows background jobs
        run: bun run test src/core/tools/backends/whiteboxJobs.test.ts
      - name: Exercise sandbox finding collection
        run: bun run test src/core/agents/specialized/pentest/results.test.ts

  # Fails a PR that introduces a critical, high or malware advisory in bun.lock.
  # osv-scanner runs offline: the advisory database is downloaded fresh, and the
  # dependency list never leaves the runner. See scripts/osv-gate.ts; its unit
  # tests run in the test job.
  vulnerable-dependencies:
    name: vulnerable-dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The gate scans the lockfile at the merge base too.
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # Pinned release, checked against the SHA-256 in its published
      # osv-scanner_SHA256SUMS before it runs.
      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: 2.7.1
          OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/osv-bin"
          mkdir -p "$bin"
          curl -fsSL -o "$bin/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $bin/osv-scanner" | sha256sum -c -
          chmod +x "$bin/osv-scanner"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Gate new vulnerable dependencies
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY: ${{ runner.temp }}/osv-db
        run: bun scripts/osv-gate.ts --base "$BASE_SHA"
