# CI Pipeline
# ===========
# Runs lint/format, typecheck, and build in parallel on every PR and push.
# Each job is a reusable workflow and shows as a separate check in the
# GitHub PR UI.

name: CI

on:
  pull_request:
  push:

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  typecheck:
    uses: ./.github/workflows/typecheck.yml

  build:
    uses: ./.github/workflows/build.yml
