# CI Pipeline
# ===========
# Runs lint/format, typecheck, and build in parallel on every PR and push to main.
# Each job is a reusable workflow and shows as a separate check in the
# GitHub PR UI.

name: CI

on:
  pull_request:
  push:
    branches: [main, canary]

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  dead-code:
    uses: ./.github/workflows/knip.yml

  typecheck:
    uses: ./.github/workflows/typecheck.yml

  test:
    uses: ./.github/workflows/test.yml

  build:
    uses: ./.github/workflows/build.yml

  windows-http:
    name: Windows tool contracts
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Exercise Windows HTTP and coding tools
        run: bun run test src/core/agents/offSecAgent/tools/windowsCurl.test.ts src/core/agents/offSecAgent/tools/fileWorkspace.test.ts
