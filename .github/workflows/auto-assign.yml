name: Auto Assign PR

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  assign:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Assign reviewer round-robin
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const team = [
              'joshkotrous',
              'yuvanesh-ux',
              'kyleryan',
              'jorgeraad',
            ];

            const author = context.payload.pull_request.user.login.toLowerCase();
            const eligible = team.filter((m) => m.toLowerCase() !== author);
            if (eligible.length === 0) return;

            const { data: recentPRs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 10,
            });

            const reviewCounts = Object.fromEntries(eligible.map((m) => [m, 0]));

            for (const pr of recentPRs) {
              if (pr.number === context.payload.pull_request.number) continue;
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
              });
              const seen = new Set();
              for (const review of reviews) {
                if (review.user.login in reviewCounts && !seen.has(review.user.login)) {
                  reviewCounts[review.user.login]++;
                  seen.add(review.user.login);
                }
              }
            }

            core.info('Review counts: ' + JSON.stringify(reviewCounts));

            const reviewer = eligible.reduce((min, m) =>
              reviewCounts[m] < reviewCounts[min] ? m : min
            );

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              reviewers: [reviewer],
            });

            core.info(`Assigned ${reviewer} to PR #${context.payload.pull_request.number}`);
