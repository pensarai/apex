name: Auto Assign PR

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write

jobs:
  assign:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Assign reviewer round-robin
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const team = [
              'joshkotrous',
              'yuvanesh-ux',
              'kylejryan',
              'jorgeraad',
            ];

            const author = context.payload.pull_request.user.login.toLowerCase();
            const eligible = team.filter((m) => m.toLowerCase() !== author);
            if (eligible.length === 0) return;

            // Balance on pending requests, not reviews already submitted, so
            // clearing your queue does not earn you the next PR as well.
            const { data: openPRs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 100,
            });

            const pendingLoad = Object.fromEntries(eligible.map((m) => [m, 0]));

            for (const pr of openPRs) {
              if (pr.number === context.payload.pull_request.number) continue;
              for (const requested of pr.requested_reviewers || []) {
                const login = requested.login;
                if (!login) continue;
                const match = eligible.find((m) => m.toLowerCase() === login.toLowerCase());
                if (match) pendingLoad[match]++;
              }
            }

            core.info('Pending review load: ' + JSON.stringify(pendingLoad));

            const sorted = [...eligible].sort((a, b) => pendingLoad[a] - pendingLoad[b]);

            for (const reviewer of sorted) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  reviewers: [reviewer],
                });
                core.info(`Assigned ${reviewer} to PR #${context.payload.pull_request.number}`);
                return;
              } catch (err) {
                core.warning(`Could not request review from ${reviewer}: ${err.message}`);
              }
            }

            core.warning('No eligible reviewer could be assigned');
