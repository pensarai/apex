name: Release

on:
  push:
    branches:
      - release

# Two pushes releasing at once would race on the same version.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: build (${{ matrix.name }})
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-14
            target: bun-darwin-arm64
            name: pensar-darwin-arm64
            ext: ""
          - os: macos-15-large
            target: bun-darwin-x64
            name: pensar-darwin-x64
            ext: ""
          - os: ubuntu-latest
            target: bun-linux-x64
            name: pensar-linux-x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            name: pensar-linux-arm64
            ext: ""
          - os: windows-latest
            target: bun-windows-x64
            name: pensar-windows-x64
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A release never restores a cache another run could have written.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate ASCII art
        run: bun run generate:ascii

      - name: Build binary (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          bun build src/cli.ts --compile --external electron --external chromium-bidi --external camoufox-js "--target=$TARGET" --outfile pensar
          tar -czvf "$NAME.tar.gz" pensar

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          bun build src/cli.ts --compile --external electron --external chromium-bidi --external camoufox-js "--target=$env:TARGET" --outfile pensar.exe
          Compress-Archive -Path "pensar.exe" -DestinationPath "$env:NAME.zip"

      - name: Upload artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the release and its tag
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # The release API creates the tag on this commit, so nothing is pushed
      # from the runner.
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          set -euo pipefail
          notes="## Upgrade

          If you already have Pensar installed, upgrade to the latest version:
          \`\`\`bash
          pensar upgrade
          \`\`\`

          ## Fresh Install

          **macOS / Linux (Quick Install)**
          \`\`\`bash
          curl -fsSL https://pensarai.com/install.sh | bash
          \`\`\`

          **Homebrew**
          \`\`\`bash
          brew tap pensarai/tap
          brew install apex
          \`\`\`

          **npm**
          \`\`\`bash
          npm install -g @pensar/apex
          \`\`\`"
          gh release create "v${VERSION}" \
            artifacts/pensar-darwin-arm64/pensar-darwin-arm64.tar.gz \
            artifacts/pensar-darwin-x64/pensar-darwin-x64.tar.gz \
            artifacts/pensar-linux-x64/pensar-linux-x64.tar.gz \
            artifacts/pensar-linux-arm64/pensar-linux-arm64.tar.gz \
            artifacts/pensar-windows-x64/pensar-windows-x64.zip \
            --target "$GITHUB_SHA" --title "v${VERSION}" --notes "$notes" --generate-notes --latest

  npm:
    name: npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A release never restores a cache another run could have written.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate ASCII art
        run: bun run generate:ascii

      - name: Build project
        run: bun run build

      # v4 caches only when `cache` is set, and it is not.
      - name: Setup Node.js for npm publish
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org" # zizmor: ignore[cache-poisoning]

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  homebrew:
    name: homebrew
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download release assets and calculate SHA256
        id: sha256
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          BASE_URL="https://github.com/pensarai/apex/releases/download/v${VERSION}"

          # Wait a moment for release assets to be available
          sleep 10

          # Download and calculate SHA256 for each platform
          curl -sL "${BASE_URL}/pensar-darwin-arm64.tar.gz" -o darwin-arm64.tar.gz
          curl -sL "${BASE_URL}/pensar-darwin-x64.tar.gz" -o darwin-x64.tar.gz
          curl -sL "${BASE_URL}/pensar-linux-x64.tar.gz" -o linux-x64.tar.gz
          curl -sL "${BASE_URL}/pensar-linux-arm64.tar.gz" -o linux-arm64.tar.gz

          echo "darwin_arm64=$(sha256sum darwin-arm64.tar.gz | cut -d ' ' -f1)" >> $GITHUB_OUTPUT
          echo "darwin_x64=$(sha256sum darwin-x64.tar.gz | cut -d ' ' -f1)" >> $GITHUB_OUTPUT
          echo "linux_x64=$(sha256sum linux-x64.tar.gz | cut -d ' ' -f1)" >> $GITHUB_OUTPUT
          echo "linux_arm64=$(sha256sum linux-arm64.tar.gz | cut -d ' ' -f1)" >> $GITHUB_OUTPUT

      # Keeps the tap token: the last step pushes the formula with it. This job
      # installs and runs nothing from either checkout.
      - name: Checkout Homebrew tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: pensarai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap # zizmor: ignore[artipacked]

      - name: Update formula
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          SHA_DARWIN_ARM64: ${{ steps.sha256.outputs.darwin_arm64 }}
          SHA_DARWIN_X64: ${{ steps.sha256.outputs.darwin_x64 }}
          SHA_LINUX_X64: ${{ steps.sha256.outputs.linux_x64 }}
          SHA_LINUX_ARM64: ${{ steps.sha256.outputs.linux_arm64 }}
        run: |
          cat > homebrew-tap/Formula/apex.rb << EOF
          class Apex < Formula
            desc "AI-powered penetration testing CLI tool with terminal UI"
            homepage "https://github.com/pensarai/apex"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/pensarai/apex/releases/download/v${VERSION}/pensar-darwin-arm64.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/pensarai/apex/releases/download/v${VERSION}/pensar-darwin-x64.tar.gz"
                sha256 "${SHA_DARWIN_X64}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/pensarai/apex/releases/download/v${VERSION}/pensar-linux-x64.tar.gz"
                sha256 "${SHA_LINUX_X64}"
              end
              on_arm do
                url "https://github.com/pensarai/apex/releases/download/v${VERSION}/pensar-linux-arm64.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              end
            end

            def install
              bin.install "pensar"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/pensar --version")
            end
          end
          EOF

      - name: Commit and push formula
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          cd homebrew-tap
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # Remove old formula if it exists
          git rm -f Formula/pensar.rb 2>/dev/null || true
          git add Formula/apex.rb
          git commit -m "apex ${VERSION}"
          git push

  notify:
    name: notify
    needs: [release, npm, homebrew]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Send release notification to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ steps.get_version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"

          RELEASE_BODY=$(gh release view "v${VERSION}" --json body -q .body 2>/dev/null || echo "")
          if [ ${#RELEASE_BODY} -gt 4000 ]; then
            RELEASE_BODY="${RELEASE_BODY:0:4000}..."
          fi

          PAYLOAD=$(jq -n \
            --arg title "v${VERSION}" \
            --arg url "$RELEASE_URL" \
            --arg desc "$RELEASE_BODY" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 2105893
              }]
            }')

          curl -sf -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL"
