name: Prerelease and Publish

on:
  push:
    branches:
      - canary

jobs:
  prerelease:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate canary version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Strip any existing prerelease suffix to get base version
          BASE_VERSION=$(echo "$CURRENT_VERSION" | sed 's/-canary\..*//')

          # Generate random suffix using short git SHA
          RANDOM_SUFFIX=$(git rev-parse --short=8 HEAD)
          NEW_VERSION="${BASE_VERSION}-canary.${RANDOM_SUFFIX}"

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

          # Update package.json with new version
          node -e "const pkg = require('./package.json'); pkg.version = '$NEW_VERSION'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Generate ASCII art
        run: bun run generate:ascii

      - name: Build project
        run: bun run build

      - name: Create tarball
        run: npm pack

      - name: Create Prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            ## v${{ steps.version.outputs.version }}

            ⚠️ **This is a prerelease version from the canary branch**

            This release may contain experimental features and is not recommended for production use.

            ### Installation
            ```bash
            npm install -g @pensar/apex@canary
            # or for a specific version
            npm install -g @pensar/apex@${{ steps.version.outputs.version }}
            ```

            ### Usage
            ```bash
            pensar
            ```

            See [README.md](https://github.com/${{ github.repository }}/blob/canary/README.md) for full documentation.
          files: |
            pensar-apex-*.tgz
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm with canary tag
        run: npm publish --access public --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
