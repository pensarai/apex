name: Prerelease and Publish

on:
  push:
    branches:
      - canary

# Two pushes publishing at once would race on npm's canary tag.
concurrency:
  group: prerelease
  cancel-in-progress: false

permissions: {}

jobs:
  prerelease:
    name: prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the prerelease and its tag

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # A publish never restores a cache another run could have written.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
          no-cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate canary version
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          # Strip any existing prerelease suffix to get base version
          BASE_VERSION=$(echo "$CURRENT_VERSION" | sed 's/-canary\..*//')

          # Generate random suffix using short git SHA
          RANDOM_SUFFIX=$(git rev-parse --short=8 HEAD)
          NEW_VERSION="${BASE_VERSION}-canary.${RANDOM_SUFFIX}"

          echo "New version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # Update package.json with new version
          node -e "const pkg = require('./package.json'); pkg.version = '$NEW_VERSION'; require('fs').writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Generate ASCII art
        run: bun run generate:ascii

      - name: Build project
        run: bun run build

      - name: Create tarball
        run: npm pack

      # The release API creates the tag on this commit, so nothing is pushed
      # from the runner.
      - name: Create Prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          notes="## v${VERSION}

          ⚠️ **This is a prerelease version from the canary branch**

          This release may contain experimental features and is not recommended for production use.

          ### Installation
          \`\`\`bash
          npm install -g @pensar/apex@canary
          # or for a specific version
          npm install -g @pensar/apex@${VERSION}
          \`\`\`

          ### Usage
          \`\`\`bash
          pensar
          \`\`\`

          See [README.md](https://github.com/${GITHUB_REPOSITORY}/blob/canary/README.md) for full documentation."
          gh release create "v${VERSION}" pensar-apex-*.tgz --target "$GITHUB_SHA" \
            --title "v${VERSION}" --notes "$notes" --generate-notes --prerelease --latest=false

      # v4 caches only when `cache` is set, and it is not.
      - name: Setup Node.js for npm publish
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org" # zizmor: ignore[cache-poisoning]

      - name: Publish to npm with canary tag
        run: npm publish --access public --tag canary
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
