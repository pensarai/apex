name: preview-docs

on:
  pull_request:
    paths:
      - "fern/**"

concurrency:
  group: preview-docs-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  run:
    name: run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comments the docs preview URL
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The version is pinned in fern/fern.config.json.
      - name: Install Fern CLI tool
        run: npm install -g "fern-api@$(jq -r .version fern/fern.config.json)" # zizmor: ignore[adhoc-packages]

      - name: Generate preview URL
        id: generate-docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          OUTPUT=$(fern generate --docs --instance pensar.docs.buildwithfern.com/apex --preview 2>&1) || true
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'Published docs to \K.*(?= \()') || true
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      # Updates one comment per PR. The marker is the one the previous comment
      # action wrote, so existing comments keep being updated.
      - name: Comment URL in PR
        if: steps.generate-docs.outputs.preview_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.generate-docs.outputs.preview_url }}
          MARKER: '<!-- thollander/actions-comment-pull-request "fern-docs-preview" -->'
        run: |
          set -euo pipefail
          body="🌿 Preview your docs: $PREVIEW_URL
          $MARKER"
          ids=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
                  --jq '.[] | select(.body | contains(env.MARKER)) | .id')
          id=${ids%%$'\n'*}
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" --silent
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -f body="$body" --silent
          fi
