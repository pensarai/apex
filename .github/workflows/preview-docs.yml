name: preview-docs

on:
  pull_request:
    paths:
      - "fern/**"

concurrency:
  group: preview-docs-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  run:
    name: run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # comments the docs preview URL
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The version is pinned in fern/fern.config.json.
      - name: Install Fern CLI tool
        run: npm install -g "fern-api@$(jq -r .version fern/fern.config.json)" # zizmor: ignore[adhoc-packages]

      - name: Generate preview URL
        id: generate-docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          OUTPUT=$(fern generate --docs --instance pensar.docs.buildwithfern.com/apex --preview 2>&1) || true
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oP 'Published docs to \K.*(?= \()') || true
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment URL in PR
        if: steps.generate-docs.outputs.preview_url != ''
        uses: thollander/actions-comment-pull-request@1d3973dc4b8e1399c0620d3f2b1aa5e795465308 # v2.4.3
        with:
          message: "🌿 Preview your docs: ${{ steps.generate-docs.outputs.preview_url }}"
          comment_tag: fern-docs-preview
