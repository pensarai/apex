name: fern-check

on:
  pull_request:
  push:
    branches:
      - canary

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Fern CLI tool
        run: npm install -g fern-api

      - name: Check docs and API are valid
        run: fern check
