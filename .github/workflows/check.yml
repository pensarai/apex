name: fern-check

on:
  pull_request:
  push:
    branches:
      - canary

concurrency:
  group: fern-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  run:
    name: run
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The version is pinned in fern/fern.config.json.
      - name: Install Fern CLI tool
        run: npm install -g "fern-api@$(jq -r .version fern/fern.config.json)" # zizmor: ignore[adhoc-packages]

      - name: Check docs and API are valid
        run: fern check
