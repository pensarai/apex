name: Finding Judge Evals

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model ID to evaluate"
        required: false
        default: "claude-haiku-4-5"
  pull_request:
    types: [opened, reopened, synchronize, labeled]

jobs:
  judge-eval:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'run-judge-evals')
    runs-on: ubuntu-latest
    env:
      RUN_FINDING_JUDGE_EVALS: "1"
      FINDING_JUDGE_EVAL_MODEL: ${{ github.event.inputs.model || 'claude-haiku-4-5' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BEDROCK_API_KEY: ${{ secrets.BEDROCK_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      PENSAR_API_KEY: ${{ secrets.PENSAR_API_KEY }}
      INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'canary' || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run finding judge evals
        run: bun run test:judge-eval
