# Reusable lint & format workflow
# Runs Biome lint, then checks formatting (Biome for JS/TS/JSON/CSS,
# Prettier for Markdown/YAML).

name: Lint

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Check formatting (Biome + Prettier)
        run: bun run format:check
