name: publish-docs

on:
  push:
    branches:
      - canary
    paths:
      - "fern/**"

# Publishes queue rather than cancel, so the newest docs always land.
concurrency:
  group: publish-docs
  cancel-in-progress: false

permissions: {}

jobs:
  run:
    name: run
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The version is pinned in fern/fern.config.json.
      - name: Install Fern CLI tool
        run: npm install -g "fern-api@$(jq -r .version fern/fern.config.json)" # zizmor: ignore[adhoc-packages]

      - name: Publish Docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: fern generate --docs --log-level debug
