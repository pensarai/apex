# zizmor checks the workflows and local actions in this repository.
# https://docs.zizmor.sh/audits/

rules:
  # Every action is pinned to a commit SHA, GitHub's own included. A tag can be
  # repointed by whoever controls the action's repository.
  unpinned-uses:
    config:
      policies:
        "*": hash-pin

  # CI workflows cancel superseded runs. auto-assign reacts to one PR event
  # and must not cancel another.
  concurrency-limits:
    ignore:
      - auto-assign.yml

  # These audits report existing findings. Each is switched back on as its
  # findings are fixed. Do not add to this list to get a check to pass.
  use-trusted-publishing:
    disable: true
